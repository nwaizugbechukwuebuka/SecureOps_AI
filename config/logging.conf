[loggers]
keys=root,secureops

[handlers]
keys=console

[formatters]
keys=default

[logger_root]
level=INFO
handlers=console

[logger_secureops]
level=DEBUG
handlers=console
qualname=secureops
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=default
args=("ext://sys.stdout",)

[formatter_default]
format=%(asctime)s %(levelname)s %(name)s: %(message)s
datefmt=%Y-%m-%d %H:%M:%S
[loggers]
keys=root,secureops

[handlers]
keys=console

[formatters]

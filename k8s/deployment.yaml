apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureops-ai
  template:
    metadata:
      labels:
        app: secureops-ai
    spec:
      containers:
        - name: secureops
          image: yourrepo/secureops-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: PROMETHEUS_ENABLED
              value: "true"
            - name: SENTRY_DSN
              value: ""